  openapi/opentext-cybersecurity-fortify-on-demand-openapi.json, live probes of
  https://api.ams.fortify.com on 2026-09-13, and https://unityapi.webrootcloudav.com/Docs/en/APIDoc/Guide
scope: >-
  Cross-cutting runtime semantics for the two OpenText Cybersecurity API surfaces. Where a mechanism is
  absent it is recorded as absent; nothing here is inferred from a marketing page.
auth_style:
  fortify_on_demand: 'OAuth 2.0 client credentials or personal access token, sent as Authorization: Bearer'
  webroot_unity: 'OAuth 2.0 password / authorization-code / token-exchange, sent as Authorization: Bearer'
  detail: authentication/opentext-cybersecurity-authentication.yml
idempotency:
  coverage: none
  mechanism: null
  header: null
  detail: >-
    No replay-protection mechanism exists on either surface. The Fortify on Demand contract contains zero
    occurrences of "Idempotency", "If-Match" or "ETag" across all 159 operations, and the Webroot Unity
    guide documents none. 71 of 159 Fortify on Demand operations are mutating (28 POST, 29 PUT, 3 PATCH,
    11 DELETE) and every one of them is replay-unsafe: re-firing ReleasesV3_PostStartScan after a timeout
    can consume a second scan entitlement. An agent must implement its own de-duplication by reading back
    state before retrying a write.
  evidence: 'grep of the published spec: "dempoten" 0 hits, "If-Match" 0 hits, "ETag" 0 hits'
reversibility:
  grade: documented
  detail: >-
    Fortify on Demand publishes reversal operations but states no window for any of them, which is exactly
    the difference between a documented and a verified reversibility posture. A scan can be cancelled while
    it is running; the eleven DELETE operations are the only undo path for the objects they remove, and the
    documentation does not say whether a deleted application, release, report, user or token can be
    restored, nor for how long.
  write_surface_operations: 71
  reversals:
  - operation: ReleasesV3_PostCancelScan
    reverses: ReleasesV3_PostStartScan and the other scan-start operations
    kind: cancel
    window: null
    window_source: null
    note: >-
      The contract gives no statement of how late in a scan a cancel is accepted, or whether a cancelled
      scan refunds the entitlement it consumed. This is the single highest-value undocumented window on the
      surface, because scan entitlements are the billing unit.
  - operation: ApplicationsV3_Delete
    kind: delete
    restore_operation: null
    window: null
  - operation: ReleasesV3_DeleteRelease
    kind: delete
    restore_operation: null
    window: null
  - operation: ApiKeyManagementV3_DeleteApiKey
    kind: revoke
    restore_operation: null
    window: null
    note: Revocation of a credential is intentionally irreversible; a new key must be created.
  - operation: PersonalAccessTokensV3_DeletePersonalAccessToken
    kind: revoke
    restore_operation: null
    window: null
  irreversible:
  - AttributesV3_Delete
  - ReportsV3_Delete
  - UsersV3_DeleteUser
  - UserManagementV3_DeleteGroup
  - UserApplicationAccessV3_DeleteUserApplicationAccess
  - UserGroupApplicationAccessV3_DeleteUserGroupApplicationAccess
  - ApplicationsV3_DeleteApplicationMicroservice
  webroot_unity:
    note: >-
      The Console GSM surface documents suspend, resume, deactivate and reactivate for endpoint sites and
      endpoints — a genuine pairwise reversal set — but the guide states no window for any of them either.
