mcp_only:
- tool: fcli tool install / definitions update
  reason: Local tool-chain management. No REST equivalent; it downloads and verifies release artifacts.
- tool: fcli ai-assist extensions setup
  reason: Installs Agent Skills into a local assistant directory. Purely local.
- tool: fcli action run
  reason: >-
    Runs a user-authored YAML action, which may compose many REST calls. Not a single operation, and
    user-defined actions can export their own functions as MCP tools.
- tool: fcli ssc / sc-sast / sc-dast commands
  reason: >-
    Target Software Security Center and ScanCentral, which are customer-hosted. No public OpenAPI exists
    for those surfaces, so they cannot be crosswalked.
- tool: fcli aviator
  reason: Talks to the Aviator backend over the gRPC services in grpc/, not over the REST API.
