api: opentext-cybersecurity:fortify-on-demand-api
note: >-
  This crosswalk is unusual and the shape matters. OpenText does not expose a hand-written MCP tool list.
  Its MCP server generates tools from fcli command modules at runtime, so the live tool names could not be
  enumerated without installing fcli and authenticating a session against a customer tenant. What IS
  published is the fcli command surface and, more usefully, nine first-party Agent Skills that name the
  exact fcli commands an agent should run. The crosswalk below therefore binds fcli COMMAND FAMILIES —
  the units the MCP server turns into tools — to the REST operationIds that back them. Confidence is
  medium throughout for that reason, and it is stated rather than inflated: every operationId below was
  grepped out of the published spec and exists, but the fcli-command-to-operation mapping is inferred from
  command semantics, not read from an fcli source map.
