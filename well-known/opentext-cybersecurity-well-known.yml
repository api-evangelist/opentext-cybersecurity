findings:
- id: no-security-txt-at-a-security-vendor
  severity: high
  detail: >-
    OpenText Cybersecurity sells vulnerability management and serves no /.well-known/security.txt on any
    of its ten hosts, including the API hosts. RFC 9116 is a four-line file and it is the single cheapest
    pointer this provider is missing.
- id: oauth-metadata-absent-on-a-host-that-runs-oauth
  severity: medium
  detail: >-
    api.ams.fortify.com serves a working OAuth 2.0 token endpoint at /oauth/token but returns 404 for
    /.well-known/oauth-authorization-server, so a client cannot discover the token endpoint, the supported
    grants or the scope vocabulary without reading prose.
