note: The Fortify on Demand data model is a strict four-level containment hierarchy — Tenant owns Applications,
  an Application owns Releases, a Release owns Scans, and a Scan produces Vulnerabilities and OpenSourceComponents
  — wrapped in a large lookup vocabulary. Identifiers are integers rather than prefixed strings, so there
  is no id-prefix scheme an agent can use to tell an applicationId from a releaseId at a glance; almost
  every 404 on this API is a correct-looking integer pointed at the wrong resource. Relationships below
  were computed from <entity>Id fields on the definitions, not assumed.
id_scheme:
  style: integer
  prefixed: false
  risk: An integer id carries no type. applicationId, releaseId, scanId, vulnId and entitlementId are
    all int32 and mutually substitutable without error until the server rejects them.
