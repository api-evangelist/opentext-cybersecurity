          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '422':
          description: UnprocessableEntity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PutApplicationResponse'
        '429':
