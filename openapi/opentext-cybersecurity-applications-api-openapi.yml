        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutApplicationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PutApplicationRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/PutApplicationRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/PutApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PutApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PutApplicationRequest'
        description: The application data
        required: true
    delete:
      tags:
      - Applications
      summary: Deletes an application
      description: 'Allowed Scopes: api-tenant, manage-apps'
