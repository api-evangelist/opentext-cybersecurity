            text/json:
              schema:
                $ref: '#/components/schemas/DeleteApplicationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DeleteApplicationResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/DeleteApplicationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '429':
          description: TooManyRequests
        '500':
