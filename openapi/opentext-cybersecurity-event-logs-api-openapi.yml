openapi: 3.2.0
info:
  version: v3
  title: Fortify on Demand Web API Explorer Event Logs API
servers:
- url: https://api.ams.fortify.com
tags:
- name: Event Logs
paths:
  /api/v3/eventlogs/download:
    get:
      tags:
      - Event Logs
      summary: Download the last 24 hours of event log data in csv format
      description: 'Allowed Scopes: api-tenant, view-tenant-data'
      operationId: EventLogsV3_Download
      responses:
        '200':
          description: Ok
          content:
            application/x-download:
              schema:
                type: string
                format: binary
        '204':
          description: NoContent
        '401':
          description: Unauthorized
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
