          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
  /api/v3/releases/{releaseId}/fpr:
    get:
      tags:
      - Releases
      summary: Get the fpr for the given release
      description: 'Allowed Scopes: api-tenant, view-issues'
      operationId: ReleasesV3_GetReleasesFPR
      parameters:
      - name: releaseId
        in: path
        description: The release id
        required: true
        schema:
          type: integer
          format: int32
      - name: scanType
        in: query
        description: The scan type
        required: true
        schema:
          type: string
          enum:
          - Static
          - Dynamic
          - Mobile
          - Monitoring
          - Network
          - OpenSource
          - SASTAviator
      responses:
        '200':
          description: Ok
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '202':
          description: Accepted
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: BadRequest
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
  /api/v3/releases/{releaseId}/category-rollups:
    get:
      tags:
      - Releases
      summary: List and count of vulnerabilities categories, by severity for this release
      description: 'Allowed Scopes: api-tenant, view-apps'
      operationId: ReleasesV3_CategoryRollups
      parameters:
      - name: releaseId
        in: path
        description: The release id
        required: true
        schema:
          type: integer
          format: int32
      - name: orderBy
        in: query
        description: The field name to order the results by.
        required: false
        schema:
          type: string
      - name: orderByDirection
        in: query
        description: The direction to order the results by. ASC and DESC are valid values.
        required: false
        schema:
          type: string
      - name: showFixed
        in: query
        description: Indicates of vulnerabilities marked as fixed should be included. Value defaults to false if not specified.
        required: false
        schema:
          type: boolean
      - name: vulnerabilitiesSeverityType
        in: query
        required: false
        schema:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Critical
          - Best_Practice
          - Info
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRollupsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CategoryRollupsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CategoryRollupsResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CategoryRollupsResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
  /api/v3/releases/{releaseId}/scans/{scanId}:
