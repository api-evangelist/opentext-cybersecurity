openapi: 3.2.0
info:
  version: v3
  title: Fortify on Demand Web API Explorer Releases API
servers:
- url: https://api.ams.fortify.com
tags:
- name: Releases
paths:
  /api/v3/releases/{releaseId}:
    get:
      tags:
      - Releases
      summary: Returns the specific release
      description: 'Allowed Scopes: api-tenant, view-apps'
      operationId: ReleasesV3_GetRelease
      parameters:
      - name: releaseId
        in: path
        description: The release id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
            text/json:
              schema:
                $ref: '#/components/schemas/Release'
            application/xml:
              schema:
                $ref: '#/components/schemas/Release'
            text/xml:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
    put:
      tags:
      - Releases
      summary: Updates an existing release
      description: 'Allowed Scopes: api-tenant, manage-apps'
      operationId: ReleasesV3_PutRelease
      parameters:
      - name: releaseId
        in: path
        description: The release id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '422':
          description: UnprocessableEntity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PutReleaseResponse'
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutReleaseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PutReleaseRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/PutReleaseRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/PutReleaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PutReleaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PutReleaseRequest'
        description: PutReleaseRequest model
        required: true
    delete:
      tags:
      - Releases
      summary: Deletes the given release
      description: 'Allowed Scopes: api-tenant, manage-apps'
      operationId: ReleasesV3_DeleteRelease
      parameters:
      - name: releaseId
        in: path
        description: The release id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/DeleteReleaseResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
  /api/v3/releases:
    get:
      tags:
      - Releases
      summary: Returns a list of releases
      description: 'Allowed Scopes: api-tenant, view-apps'
      operationId: ReleasesV3_GetReleases
      parameters:
      - name: filters
        in: query
        description: 'A delimited list of field filters.

          <br /><br />Field name and value should be separated by a colon (:).

          <br /><br />Multiple fields should be separated by a plus (+). Multiple fields are treated as an AND condition. Example, fieldname1:value+fieldname2:value

          <br /><br />Multiple values for a field should be separated by a pipe (|). Mulitple values for a field are treated as an OR condition. Example, fieldname1:value1|value2

          <br /><br />Filtering is not supported for the following fields: suspended'
        required: false
        schema:
          type: string
      - name: orderBy
        in: query
        description: The field name to order the results by.
        required: false
        schema:
          type: string
      - name: orderByDirection
        in: query
        description: The direction to order the results by. ASC and DESC are valid values.
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: Comma separated list of fields to return.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Offset of the starting record. 0 indicates the first record.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum records to return. The maximum value allowed is 50.
        required: false
        schema:
          type: integer
          format: int32
      - name: modifiedStartDate
        in: query
        description: The modified on or after date.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: NotFound
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
    post:
      tags:
      - Releases
      summary: Creates a new release
      description: 'Allowed Scopes: api-tenant, manage-apps'
      operationId: ReleasesV3_PostRelease
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostReleaseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PostReleaseResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/PostReleaseResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PostReleaseResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '422':
          description: UnprocessableEntity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostReleaseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PostReleaseRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/PostReleaseRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/PostReleaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostReleaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostReleaseRequest'
        description: PostReleaseRequest model
        required: true
  /api/v3/releases/{releaseId}/scans/{scanId}/polling-summary:
    get:
      tags:
      - Releases
      summary: Returns Scan status for a specific scan
      description: 'Allowed Scopes: api-tenant, view-apps'
      operationId: ReleasesV3_GetReleaseScanByScanId
      parameters:
      - name: releaseId
        in: path
