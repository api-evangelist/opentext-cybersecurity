            text/json:
              schema:
                $ref: '#/components/schemas/PollingScanSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/PollingScanSummary'
            text/xml:
              schema:
                $ref: '#/components/schemas/PollingScanSummary'
