aid: opentext-cybersecurity
name: OpenText Cybersecurity
description: >-
  OpenText Cybersecurity is the security business of OpenText, assembled from the Micro Focus security
  portfolio (Fortify application security, ArcSight threat detection and response, NetIQ identity and
  access management, Voltage data privacy) and the SMB/MSP brands OpenText acquired through Webroot,
  Carbonite and Zix — endpoint protection, DNS protection, EDR/MDR, email threat protection and
  encryption, security awareness training, backup and disaster recovery. Two product lines expose a
  public developer surface. OpenText Core Application Security (Fortify on Demand) publishes a live
  Swagger 2.0 contract with 159 operations across applications, releases, static/dynamic/mobile scans,
  vulnerabilities, reports and tenant administration, served per region from api.ams / api.emea /
  api.apac.fortify.com. The Webroot Unity API is the multi-tenant REST platform managed service
  providers use to run Secure Cloud sites, endpoints, policies, licensing and near-real-time event
  notifications. Fortify also ships a first-party CLI (fcli), a first-party MCP server inside that CLI,
  and a published set of Agent Skills for Claude Code, GitHub Copilot, Codex and Gemini CLI.
