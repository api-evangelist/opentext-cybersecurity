apis:
- aid: opentext-cybersecurity:fortify-on-demand-api
  name: OpenText Core Application Security (Fortify on Demand) API
  description: >-
    The REST API behind OpenText Core Application Security, still branded Fortify on Demand across the
    contract and the tooling. 159 operations over 125 paths cover applications, releases, static,
    dynamic, mobile and open-source scans, vulnerability audit and triage, reports, API keys, personal
    access tokens, users and tenant entitlements. The spec is served live and unauthenticated from
    every regional API host and every operation declares its required OAuth scope in its description.
  humanURL: https://api.ams.fortify.com/swagger/ui/index
  baseURL: https://api.ams.fortify.com
  tags:
