- aid: opentext-cybersecurity:webroot-unity-api
  name: Webroot Unity API
  description: >-
    The Webroot Unity API is the multi-tenant REST platform OpenText Cybersecurity partners and managed
    service providers use to reach Webroot and Secure Cloud services — endpoint status, Global Site
    Manager console site/user/policy/endpoint/group management, DNS Protection, Web Threat Shield,
    security awareness training reporting, usage reporting, eCommerce licensing, and Secure Cloud
    customers and usage. It also carries a documented event-notification surface with fetch and webhook
    delivery. Access is OAuth 2.0 and credentials must be issued by a Webroot representative or enabled
    from a GSM console, so no machine-readable contract is published anonymously.
  humanURL: https://unityapi.webrootcloudav.com/Docs/en/APIDoc
  baseURL: https://unityapi.webrootcloudav.com
  tags:
