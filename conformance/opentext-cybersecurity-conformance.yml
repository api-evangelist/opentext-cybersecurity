trust_center:
  published: false
  evidence: >-
    trust.opentext.com does not resolve (DNS failure, 2026-09-13) and trust.cybersecurity.opentext.com does
    not resolve. No Vanta/Drata/SafeBase-style trust portal was found for the cybersecurity business.
  probes:
