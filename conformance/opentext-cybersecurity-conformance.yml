domain_standards:
- id: sarif
  name: OASIS SARIF (Static Analysis Results Interchange Format)
  conforms: true
  evidence: >-
    SARIF is a first-class ingest and export format across the Fortify tool chain — fortify/fortify-ssc-parser-sarif
    is a published SSC parser plugin for SARIF input, and the Fortify AST Scan GitHub Action emits SARIF to
    GitHub code scanning. This is the interchange standard of the application-security market and Fortify
    speaks it natively rather than requiring a bespoke connector.
  artifacts:
