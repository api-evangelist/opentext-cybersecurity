findings:
- id: compliance-behind-a-bot-wall
  severity: medium
  detail: >-
    OpenText's compliance attestations live on www.opentext.com, which returns HTTP 444 to non-browser
    clients on every path including /.well-known/*. The effect is that a company whose product is
    cybersecurity publishes compliance evidence a machine cannot read, while its FedRAMP authorization is
    only independently verifiable because the US government publishes it. A trust page on the reachable
    cybersecurity.opentext.com host, or a /.well-known/security.txt with a Policy: line, would fix this at
    no cost to the bot policy.
