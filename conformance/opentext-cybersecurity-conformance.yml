note: >-
  This is a security vendor, so the temptation to over-credit compliance is high. Only two classes are
  recorded below: protocol conformance this pipeline could verify against the contract or a live response,
  and certifications published on a named, citable third-party register. OpenText corporate attestations
  that could not be read without a sales gate are recorded as unverified rather than asserted.
conformance:
- id: oauth2
  conforms: true
  evidence: >-
    POST https://api.ams.fortify.com/oauth/token with grant_type=client_credentials returned the RFC 6749
    error object {"error":"invalid_grant","error_description":"Scope is required"} on 2026-09-13. The
    Webroot Unity API documents password, authorization-code and token-exchange grants with refresh-token
    rotation at https://unityapi.webrootcloudav.com/Docs/en/APIDoc/Guide.
- id: rfc6750
  name: OAuth 2.0 Bearer Token Usage
  conforms: true
  evidence: >-
    Both surfaces carry the token in an Authorization: Bearer header. Webroot Unity returns
    error="invalid_token" on 401 and error="insufficient_scope" on 403, the RFC 6750 error codes; that
    invalid_token body was observed live at
    https://unityapi.webrootcloudav.com/service/api/console/gsm/swagger on 2026-09-13.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on every OpenText Cybersecurity host probed on 2026-09-13.
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No application/problem+json anywhere in the Fortify on Demand contract; both surfaces use a proprietary
    JSON error envelope. See errors/opentext-cybersecurity-problem-types.yml.
- id: rfc8594
  name: Sunset HTTP Header
  conforms: false
