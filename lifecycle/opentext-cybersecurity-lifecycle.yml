deprecation_policy:
  published: partial
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: >-
    No RFC 8594 Sunset or Deprecation header is documented or observed on either surface, and no operation
    in the Fortify on Demand contract carries the OpenAPI `deprecated: true` flag. What OpenText does
    practise, consistently and in public, is repository-level deprecation with a named successor: eight
    GitHub projects (FortifyVulnerabilityExporter, FortifyToolsInstaller, gha-setup-scancentral-client,
    gha-setup-fod-uploader, gha-setup-bugtracker-utility, gha-export-vulnerabilities,
    gha-fod-generate-sarif, gha-ssc-generate-sarif) each carry a description of the form "Deprecated;
    please use <successor>", and two parser plugins are archived with an explicit EOL reason. That is a
    real, followed deprecation practice on the tooling; it is not yet expressed on the API contract.
  deprecated_tooling:
  - name: FortifyVulnerabilityExporter
    successor: fcli
  - name: FortifyToolsInstaller
    successor: fcli tool * install
  - name: gha-setup-scancentral-client
    successor: fortify/github-action (Fortify AST Scan)
  - name: gha-setup-fod-uploader
    successor: fortify/github-action (Fortify AST Scan)
  - name: gha-setup-bugtracker-utility
    successor: fortify/github-action (Fortify AST Scan)
  - name: gha-export-vulnerabilities
    successor: fortify/github-action (Fortify AST Scan)
  - name: gha-fod-generate-sarif
    successor: fortify/github-action (Fortify AST Scan)
  - name: gha-ssc-generate-sarif
    successor: fortify/github-action (Fortify AST Scan)
  - name: fortify-ssc-parser-symfony-security-checker
    reason: Symfony Security Checker considered EOL
    archived: true
  - name: fortify-ssc-parser-php-security-checker
    reason: PHP Security Checker considered EOL
    archived: true
deprecated_operations: []
deprecated_operations_note: >-
  Zero of the 159 Fortify on Demand operations are flagged deprecated in the published contract.
