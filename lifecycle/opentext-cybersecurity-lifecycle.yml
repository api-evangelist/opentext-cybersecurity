findings:
- id: no-sunset-header
  severity: low
  detail: >-
    OpenText already deprecates tooling responsibly and names successors. Extending the same discipline to
    the API — an OpenAPI `deprecated: true` flag plus RFC 8594 Sunset/Deprecation headers — would let an
    agent detect a retirement at call time rather than by reading a repository description.
