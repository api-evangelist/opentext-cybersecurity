note: >-
  These are NOT API Evangelist generations. OpenText Fortify publishes its own Agent Skills package at
  github.com/fortify/skills (release v1.3.0, 2026-07-31) and the files below are saved verbatim from
  that repository. The package registers nine skills and two multi-skill agents, is installable as a
  Claude Code plugin (claude plugin marketplace add fortify/skills), an OpenAI Codex plugin, a Gemini
  CLI extension and a GitHub Copilot skills directory, and can also be installed by fcli itself via
  `fcli ai-assist extensions setup`. Every skill is grounded in the fcli command surface rather than in
  raw HTTP calls, so the operations they invoke reach the Fortify on Demand REST API through fcli.
